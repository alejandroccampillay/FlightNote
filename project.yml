# Definición del proyecto Xcode. Generar con: xcodegen generate
name: FlightNote
options:
  bundleIdPrefix: app.flightnote
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FlightNoteKit:
    path: Packages/FlightNoteKit

targets:
  FlightNote:
    type: application
    platform: iOS
    sources:
      - path: App/FlightNote
    dependencies:
      - package: FlightNoteKit
        product: FNDomain
      - package: FlightNoteKit
        product: FNReferenceData
      - package: FlightNoteKit
        product: FNPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.flightnote.ios
        PRODUCT_NAME: FlightNote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlightNote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FlightNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/FlightNoteUITests
    dependencies:
      - target: FlightNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.flightnote.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlightNote

schemes:
  FlightNote:
    build:
      targets:
        FlightNote: all
        FlightNoteUITests: [test]
    test:
      targets:
        - FlightNoteUITests
    run:
      config: Debug
    archive:
      config: Release
